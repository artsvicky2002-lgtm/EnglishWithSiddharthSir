<!doctype html><html><head><meta name="viewport" content="width=device-width,initial-scale=1"><title>Admin Panel</title><style>
*{box-sizing:border-box}body{margin:0;font-family:Arial;background:#f5f7fb;color:#172033}.nav{background:#102a5c;color:#fff;padding:16px 22px;display:flex;justify-content:space-between;align-items:center}.nav button{background:#fff;color:#173f8a;border:0;border-radius:7px;padding:9px}.wrap{max-width:1100px;margin:auto;padding:24px}.tabs button{padding:11px 15px;border:0;border-radius:7px;margin:3px;background:#e8eef8;font-weight:bold}.tabs .on{background:#2563eb;color:white}.panel{background:#fff;border:1px solid #e2e8f0;border-radius:13px;padding:20px;margin-top:18px}input,select,textarea{width:100%;padding:10px;border:1px solid #d8dfeb;border-radius:7px;margin:6px 0 12px}button{cursor:pointer}.primary{background:#2563eb;color:#fff;border:0;padding:10px 15px;border-radius:7px;font-weight:bold}.danger{background:#fee2e2;color:#b91c1c;border:0;padding:8px;border-radius:7px}.q{border:1px solid #e1e7f0;padding:14px;border-radius:9px;margin:12px 0}.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}@media(max-width:650px){.grid{grid-template-columns:1fr}}
</style></head><body><div class="nav"><b>EnglishWithSiddharthSir — Admin</b><button onclick="logout()">Logout</button></div><div class="wrap"><div class="tabs"><button id="tq" class="on" onclick="tab('quiz')">Quiz Manager</button><button id="tn" onclick="tab('notes')">Notes Manager</button><button id="ta" onclick="tab('analytics')">Analytics</button></div><div id="quiz" class="panel"></div><div id="notes" class="panel" style="display:none"></div><div id="analytics" class="panel" style="display:none"></div></div><script>
let quizzes=[],edit=null;
const $=id=>document.getElementById(id);
async function auth(){let r=await fetch("/api/me");if(!(await r.json()).authenticated)location="login.html"}auth();
function tab(x){$("quiz").style.display=x=="quiz"?"block":"none";$("notes").style.display=x=="notes"?"block":"none";$("analytics").style.display=x=="analytics"?"block":"none";$("tq").className=x=="quiz"?"on":"";$("tn").className=x=="notes"?"on":"";$("ta").className=x=="analytics"?"on":"";if(x=="quiz")render();else if(x=="notes")notes();else analytics()}
async function data(){return (await fetch("/api/quizzes")).json()}
function form(qs=[]){return `<h2>${edit?"Edit":"Create"} Quiz</h2><input id="title" placeholder="Quiz title"><input id="duration" type="number" min="0" placeholder="Duration (minutes; 0=no timer)"><input id="negative" type="number" min="0" step="0.25" placeholder="Negative marks per wrong"><select id="difficulty"><option>Easy</option><option selected>Medium</option><option>Hard</option></select><select id="cat"><option>Grammar</option><option>Vocabulary</option><option>Literature</option><option>Mixed English</option></select><div id="qs"></div><button class="primary" onclick="addQ()">+ Add Question</button> <button class="primary" onclick="saveQ()">Save Quiz</button>`}
function addQ(q={}){let d=document.createElement("div");d.className="q";d.innerHTML=`<b>Question</b><textarea class="qq">${q.question||""}</textarea><div class="grid"><input class="a" placeholder="Option A" value="${q.a||""}"><input class="b" placeholder="Option B" value="${q.b||""}"><input class="c" placeholder="Option C" value="${q.c||""}"><input class="d" placeholder="Option D" value="${q.d||""}"></div><select class="correct"><option>A</option><option>B</option><option>C</option><option>D</option></select><input class="exp" placeholder="Explanation" value="${q.explanation||""}"><button class="danger" onclick="this.parentElement.remove()">Remove</button>`;$("qs").appendChild(d);if(q.correct)d.querySelector(".correct").value=q.correct}
async function render(){quizzes=await data();$("quiz").innerHTML=form();$("qs").innerHTML="";addQ();$("quiz").innerHTML+=`<hr><h2>Existing Quizzes</h2>`+quizzes.map(q=>`<p><b>${q.title}</b> — ${q.category} — ${q.questions.length} questions <button onclick="editQ(${q.id})">Edit</button> <button class="danger" onclick="delQ(${q.id})">Delete</button></p>`).join("")}
async function saveQ(){let qs=[...document.querySelectorAll(".q")].map(x=>({question:x.querySelector(".qq").value,a:x.querySelector(".a").value,b:x.querySelector(".b").value,c:x.querySelector(".c").value,d:x.querySelector(".d").value,correct:x.querySelector(".correct").value,explanation:x.querySelector(".exp").value}));let body={title:$("title").value,category:$("cat").value,questions:qs};let url=edit?"/api/quizzes/"+edit:"/api/quizzes",method=edit?"PUT":"POST";let r=await fetch(url,{method,headers:{"Content-Type":"application/json"},body:JSON.stringify(body)});if(r.ok){edit=null;render()}else alert("Could not save")}
function editQ(id){let q=quizzes.find(x=>x.id==id);edit=id;render().then(()=>{$("title").value=q.title;$("cat").value=q.category;$("qs").innerHTML="";q.questions.forEach(addQ)})}
async function delQ(id){if(confirm("Delete quiz?")){await fetch("/api/quizzes/"+id,{method:"DELETE"});render()}}
async function notes(){let ns=await (await fetch("/api/notes")).json();$("notes").innerHTML=`<h2>Upload Notes</h2><input id="nt" placeholder="Note title"><select id="nc"><option>Grammar</option><option>Vocabulary</option><option>Literature</option><option>Study Material</option></select><textarea id="nd" placeholder="Description"></textarea><input id="nf" type="file" accept=".pdf,.png,.jpg,.jpeg,.webp"><button class="primary" onclick="uploadNote()">Upload Note</button><hr><h2>Existing Notes</h2>`+ns.map(n=>`<p><a href="/uploads/${n.file}" target="_blank">${n.title}</a> — ${n.category} <button class="danger" onclick="delNote(${n.id})">Delete</button></p>`).join("")}
async function uploadNote(){let f=$("nf").files[0];if(!f)return alert("Choose a file");let fd=new FormData();fd.append("title",$("nt").value);fd.append("category",$("nc").value);fd.append("description",$("nd").value);fd.append("file",f);let r=await fetch("/api/notes",{method:"POST",body:fd});if(r.ok)notes();else alert((await r.json()).error)}
async function delNote(id){if(confirm("Delete note?")){await fetch("/api/notes/"+id,{method:"DELETE"});notes()}}
async function logout(){await fetch("/api/logout",{method:"POST"});location="login.html"}
</script></body></html><script>
async function analytics(){let d=await(await fetch("/api/admin/analytics")).json();$("analytics").innerHTML=`<h2>Analytics</h2><p><b>Students:</b> ${d.students} &nbsp; <b>Attempts:</b> ${d.attempts} &nbsp; <b>Average:</b> ${d.avg}%</p><h3>Top Recent Scores</h3>${d.top.map(x=>`<p><b>${x.name}</b> — ${x.title} — ${x.score}/${x.total} (${x.percentage}%)</p>`).join("")||"<p>No attempts yet.</p>"}`}
</script>
